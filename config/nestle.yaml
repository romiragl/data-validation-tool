# Nestle client configuration
# This file drives the validation engine for Nestle.
# To add another client: copy this file, rename it, and adjust values.

client_id: nestle
client_display_name: "Nestlé India"

# Location master table (used for completeness check)
location_master_table: ebux_offtake.nestle_location_master

# Shared PDP crawl table
pdp_table: ebux_pdp

# Completeness check: set expected_skus and expected_locations per platform
# Leave null to skip the completeness check for that platform
# Format: pf_id -> {expected_skus: N, expected_locations: M}
completeness_targets:
  # Examples (fill in when you have the real numbers):
  # 2:   {expected_skus: 100, expected_locations: 10}
  # 4:   {expected_skus: 80,  expected_locations: 8}

# Column name remapping — change these if the real DB uses different names
# Format: logical_name: actual_column_name_in_db
column_map:
  pf_id: pf_id
  sku_id: sku_id
  sku_name: sku_name
  mrp: mrp
  sp: sp
  price_rp: price_rp
  price_sp: price_sp
  osa: osa
  osa_remark: osa_remark
  region: region
  location_id: location_id
  status: status
  crawl_date: crawl_date
  product_id: product_id

# OSA remark code meanings (do not change unless source changes)
osa_remark_codes:
  out_of_stock: 0
  in_stock: 1
  not_listed: 2

# Status flag values in the crawl table
status_values:
  raw: "raw"
  processed: "processed"

# Active platform IDs for this client (from platform_nestle.xlsx, status=1)
